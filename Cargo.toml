[workspace]
resolver = "2"
members = [
    "crates/relay-protocol",
    "crates/relay-test-harness",
]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ekscrypto/spacetimedb-relay"

[workspace.dependencies]
relay-protocol = { path = "crates/relay-protocol" }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"
http = "1"
url = "2"
rustls = { version = "0.23", features = ["ring"] }

axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"

tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

anyhow = "1"
thiserror = "2"

clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
hex = "0.4"
rand = "0.8"

# SpacetimeDB wire crates (relay-protocol + relay-test-harness).
spacetimedb-sats = "2.2"
spacetimedb-client-api-messages = "2.2"
spacetimedb-lib = "2.2"

# v1 compat for relay-test-harness integrity checks against v1.bsatn endpoints.
spacetimedb-client-api-messages-v1 = { package = "spacetimedb-client-api-messages", version = "=1.12.0" }
spacetimedb-lib-v1 = { package = "spacetimedb-lib", version = "=1.12.0" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
